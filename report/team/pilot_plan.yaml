# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
# Số tính bằng src/lab13.py (hàm co_mau, he_so_thiet_ke, nhiem_vu_D).
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0.70, 0.75) = 1.251 yêu cầu mỗi nhóm (statsmodels arcsine cho 1.250).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm
#      → 3.103 / 75 = 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên: KHÔNG đủ người.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251: KHÔNG đạt.
#   d) 6 depot mỗi nhóm: n hiệu dụng tối đa = 6 / 0,02 = 300 (và chỉ 6 cụm < 20): loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm:
#      20m / (1 + (m − 1) × 0,02) ≥ 859 → 2,82m ≥ 841,82 → m ≥ 299 yêu cầu mỗi nhân viên (DE = 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng các depot với nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên chia sẻ câu trả lời trong cùng depot; khoá quyền trợ lý theo tài khoản, log lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trong file này trước ngày bắt đầu 2026-12-01.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chấp nhận mde = 0,06 (859 mỗi nhóm, mỗi nhân viên ≥ 299 yêu cầu trong pilot).
#   Con số bất lợi: nếu tác động thật chỉ 5 điểm thì power chỉ còn 0,64 (NormalIndPower, n = 859).
#   Giám đốc vận hành phải ký chấp nhận đánh đổi này trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang 3,97% (39/982).
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng: chênh so với đối chứng ≥ 2 điểm
#   HOẶC trần tuyệt đối 6% (cao hơn mức hiện tại ~2 điểm), cộng 0 ca hoàn trùng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ loai noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated; thành công 95,0% và 74,1%), ở cả 12 depot với 40 nhân viên CSKH. Loại quoc_te (1,88× simulated, thành công 27,3%, chạy lại không giúp) và doi_tac (0,85× simulated, điều khoản riêng)."
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # m = 299 yêu cầu mỗi nhân viên, ICC 0,02
    clusters_per_arm: 20
    requests_per_cluster_min: 299
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng thời gian, cùng depot, cùng loại yêu cầu với 20 nhân viên dùng trợ lý"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý; giảm bằng khoá quyền theo tài khoản, log agent_suggestion_shown theo staff_id, đo tỉ lệ đối chứng mở trợ lý (ngưỡng 0%)"
    predeclared: "Chỉ số chính, mde 0,06, ba luật dừng và ngày quyết định 2027-01-05 được chốt và commit trước ngày bắt đầu 2026-12-01; seed bốc thăm ghi trong repo"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên, hoặc vượt 6%, hoặc có từ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành bật cờ tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà toàn bộ trace liên quan trong 24 giờ KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (phút xem lại và làm lại đo thật, chưa gồm cố định) vượt 6.000 đ, gấp 1,76 lần mức 3.414 đ simulated của phạm vi, TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và đặt giới hạn 2 lần chạy (rẻ nhất cho công ty theo B3) KHÔNG THÌ không được mở lại hang_nang hay tăng số nhân viên dùng trợ lý"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua cộng bo chia số được xem lại) vượt 40%, so với 27,12% trong đợt chạy thử, TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên dùng trợ lý trong 3 ngày và PM sửa luồng gợi ý KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn (mở lại 7 ngày, hoàn trùng) hằng ngày và chi phí, tỉ lệ bỏ qua hằng tuần; không nhìn chỉ số chính trước ngày quyết định để tránh dừng sớm vì nhiễu"
  rollback: "Giám đốc vận hành (hoặc Kỹ sư trưởng agent khi trực) bật cờ tắt trợ lý, hiệu lực trong 30 phút; mọi yêu cầu đang mở chuyển về luồng nhân viên tự làm như nhóm đối chứng, kèm tóm tắt trace"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated: 890 phút, 1.780.000 đ"
    - "phut_lam_lai_simulated: 1.132 phút, 2.264.000 đ"
    - "Chi phí mỗi việc thành công 4.472 đ toàn mẫu; 3.414 đ phạm vi noi_dia cộng hang_nang"
    - "Chi phí theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ"
    - "Chi phí cộng cố định: 4.599 đ (0,38×) ở 45.000 yc/tháng; 5.784 đ (0,48×) ở một nửa khối lượng"
    - "Chi phí cả hệ thống 5.865 đ mỗi yêu cầu (0,49×)"
    - "Bảng độ nhạy B1, B2, B3 (mọi số chi phí)"
    - "B4 xem lại 100%: 11.743 đ (0,98×), 12.414 đ (1,03×) nếu làm lại 15,3 phút"
